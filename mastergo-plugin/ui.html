<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Design Spec Export</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 12px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1f2329; background: #f7f8fa;
    display: flex; flex-direction: column;
  }
  header {
    padding: 12px 14px 10px; background: #fff; border-bottom: 1px solid #e5e6eb;
  }
  h1 { margin: 0 0 2px; font-size: 13px; font-weight: 600; }
  .sub { color: #86909c; font-size: 11px; }
  .actions { display: flex; gap: 8px; padding: 10px 14px; background: #fff; border-bottom: 1px solid #e5e6eb; }
  button {
    flex: 1; padding: 7px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid #e5e6eb; background: #fff; color: #1f2329; font-size: 12px;
    transition: .15s;
  }
  button:hover { border-color: #165dff; color: #165dff; }
  button.primary { background: #165dff; border-color: #165dff; color: #fff; }
  button.primary:hover { background: #0e42d2; color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #status { padding: 8px 14px; color: #86909c; font-size: 11px; min-height: 28px; }
  #status.err { color: #f53f3f; }
  .stats { display: none; gap: 6px; padding: 0 14px 8px; flex-wrap: wrap; }
  .stats.on { display: flex; }
  .chip {
    padding: 3px 8px; border-radius: 4px; background: #e8f3ff; color: #165dff; font-size: 11px;
  }
  .chip.warn { background: #fff7e8; color: #d25f00; }
  .tabs { display: flex; gap: 6px; padding: 0 14px 6px; }
  .tab { padding: 3px 10px; border-radius: 4px; cursor: pointer; background: #eef0f3; color: #4e5969; }
  .tab.on { background: #165dff; color: #fff; }
  pre {
    flex: 1; margin: 0 14px 12px; padding: 10px; overflow: auto;
    background: #fff; border: 1px solid #e5e6eb; border-radius: 6px;
    font: 11px/1.55 ui-monospace, Consolas, monospace; color: #4e5969;
    white-space: pre-wrap; word-break: break-all;
  }
  footer { display: flex; gap: 8px; padding: 0 14px 12px; }
  footer button { flex: 1; }
</style>
</head>
<body>
  <header>
    <h1>Design Spec Export</h1>
    <div class="sub">直读设计稿属性 · 零格式转换</div>
  </header>

  <div class="actions">
    <button id="btn-page" class="primary">导出当前页</button>
    <button id="btn-sel">导出选中</button>
    <button id="btn-all">含隐藏</button>
  </div>

  <div id="status">选择范围后开始。</div>

  <div id="stats" class="stats"></div>

  <div class="tabs" id="tabs" style="display:none">
    <div class="tab on" data-view="ai">AI 文本</div>
    <div class="tab" data-view="json">spec JSON</div>
  </div>

  <pre id="out"></pre>

  <footer id="footer" style="display:none">
    <button id="btn-copy">复制当前视图</button>
    <button id="btn-download" class="primary">下载 .spec.json</button>
  </footer>

<script>
  var state = { spec: null, ai: '', view: 'ai' };

  function $(id) { return document.getElementById(id); }

  function setStatus(msg, isErr) {
    var el = $('status');
    el.textContent = msg;
    el.className = isErr ? 'err' : '';
  }

  function renderStats(s, ms) {
    var box = $('stats');
    box.innerHTML = '';
    var items = [
      ['图层 ' + s.nodes, ''],
      ['圆角 ' + s.withRadius, ''],
      ['自动布局 ' + s.withAutoLayout, ''],
      ['文本 ' + s.withText, ''],
      ['隐藏 ' + s.hidden, s.hidden ? 'warn' : ''],
      ['耗时 ' + ms + 'ms', '']
    ];
    items.forEach(function (it) {
      var d = document.createElement('span');
      d.className = 'chip ' + (it[1] || '');
      d.textContent = it[0];
      box.appendChild(d);
    });
    box.classList.add('on');
  }

  function renderOut() {
    if (!state.spec) { $('out').textContent = ''; return; }
    $('out').textContent = state.view === 'ai'
      ? state.ai
      : JSON.stringify(state.spec, null, 2);
  }

  function send(payload) {
    var msg = { pluginMessage: payload };
    parent.postMessage(msg, '*');
    // 兼容部分宿主的直投方式
    if (parent !== window) { try { parent.postMessage(payload, '*'); } catch (e) {} }
  }

  function busy(on) {
    ['btn-page', 'btn-sel', 'btn-all'].forEach(function (id) {
      $(id).disabled = on;
    });
  }

  $('btn-page').onclick = function () { busy(true); setStatus('遍历当前页…'); send({ type: 'run', scope: 'page' }); };
  $('btn-sel').onclick = function () { busy(true); setStatus('遍历选中图层…'); send({ type: 'run', scope: 'selection' }); };
  $('btn-all').onclick = function () { busy(true); setStatus('遍历当前页（含隐藏）…'); send({ type: 'run', scope: 'page', includeHidden: true }); };

  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
    t.onclick = function () {
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (x) { x.classList.remove('on'); });
      t.classList.add('on');
      state.view = t.dataset.view;
      renderOut();
    };
  });

  $('btn-copy').onclick = function () {
    var text = $('out').textContent;
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    if (!ok && navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function () {
        setStatus('已复制 ' + text.length + ' 字符');
      }).catch(function () { setStatus('复制失败，请在预览区手动全选（Ctrl/Cmd+A）后复制', true); });
      return;
    }
    setStatus(ok ? '已复制 ' + text.length + ' 字符' : '复制失败，请手动全选复制', !ok);
  };

  $('btn-download').onclick = function () {
    if (!state.spec) return;
    var name = (state.spec.meta && state.spec.meta.page ? String(state.spec.meta.page) : 'design')
      .replace(/[\\/:*?"<>|]/g, '_') + '.spec.json';
    try {
      var blob = new Blob([JSON.stringify(state.spec, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
      setStatus('已触发下载：' + name + '（若浏览器拦截，改用「复制当前视图」）');
    } catch (e) {
      setStatus('下载被宿主拦截：' + e.message + '。请切到 spec JSON 视图，复制后存成 ' + name, true);
    }
  };

  window.onmessage = function (e) {
    var m = e.data && (e.data.pluginMessage || e.data);
    if (!m || !m.type) return;
    if (m.type === 'progress') {
      setStatus(m.message);
    } else if (m.type === 'error') {
      busy(false);
      setStatus(m.message, true);
    } else if (m.type === 'result') {
      busy(false);
      state.spec = m.spec;
      state.ai = m.ai || '';
      renderStats(m.stat, m.ms);
      $('tabs').style.display = 'flex';
      $('footer').style.display = 'flex';
      renderOut();
      var warn = m.stat.withAutoLayout === 0
        ? '（本页没有自动布局节点，间距只能靠 visualPad/visualGap 推导）'
        : '';
      setStatus('完成：' + m.stat.nodes + ' 个图层 ' + warn);
    }
  };
</script>
</body>
</html>
